<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creative Visuals — Divya Tak</title>
<meta name="description" content="Interactive sketches you play with your hands, in the browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* The sketches are all dark and lit from inside. On white each tile floats
       as a separate rectangle; on the same black they sit in, the light in
       them carries the page. So the ground here is theirs, not the skin's. */
    --bg: #0a0a0a;
    --ink: rgba(255,255,255,0.92);
    --ink-2: rgba(255,255,255,0.5);
    --ink-3: rgba(255,255,255,0.35);
    --line: rgba(255,255,255,0.1);
    --tile: #05060a;
    --font: 'Montserrat', system-ui, -apple-system, sans-serif;
    --ease-soft: cubic-bezier(0.25, 0.46, 0.45, 0.94);
    --hover-on: 0.2s;
    --hover-off: 0.35s;
  }

  *, *::before, *::after { box-sizing: border-box; }
  * { margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  img { display: block; max-width: 100%; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .page {
    max-width: 62rem;
    margin: 0 auto;
    padding: clamp(2rem, 6vw, 3.5rem) clamp(1.25rem, 5vw, 2.5rem) 4rem;
  }

  /* The header says the one thing you need to know and gets out of the way. */
  header { margin-bottom: clamp(2rem, 5vw, 3rem); }
  h1 { font-size: 1.15rem; font-weight: 600; letter-spacing: 0.01em; }
  .sub { margin-top: 0.35rem; color: var(--ink-2); font-weight: 300; }
  .sub a { color: var(--ink-2); text-decoration-color: rgba(255,255,255,0.25); }
  .sub a:hover { color: var(--ink); }

  /* The grid is the page. Nothing here competes with the pictures. */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(19rem, 1fr));
    gap: clamp(1.25rem, 3vw, 2rem);
  }
  .piece { text-decoration: none; color: inherit; display: block; }
  .piece img {
    width: 100%;
    height: auto;          /* the width/height attributes are for layout stability only */
    aspect-ratio: 3 / 2;
    object-fit: cover;
    background: var(--tile);
    transition: transform var(--hover-off) var(--ease-soft),
                filter var(--hover-off) var(--ease-soft);
  }
  .piece:hover img, .piece:focus-visible img {
    transform: translateY(-3px);
    filter: brightness(1.12);
    transition-duration: var(--hover-on);
  }
  .piece .cap {
    display: block;
    margin-top: 0.6rem;
    font-size: 0.95rem;
    font-weight: 600;
  }
  /* a portrait piece in a landscape tile: crop from nearer the top, where
     the drawn figure is, rather than the middle */
  .piece img.tall { object-position: center 22%; }

  footer {
    margin-top: 4rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--line);
    font-size: 0.8rem;
    color: var(--ink-3);
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 1.5rem;
    justify-content: space-between;
  }
  footer a { color: var(--ink-2); text-decoration: none; }
  footer a:hover { color: var(--ink); }

  @media (prefers-reduced-motion: reduce) {
    .piece:hover img, .piece:focus-visible img { transform: none; }
    :root { --hover-on: 0s; --hover-off: 0s; }
  }
</style>
</head>
<body>
<main class="page">

  <header>
    <h1>Creative Visuals</h1>
    <p class="sub">Sketches you play with your hands, in the browser. By <a href="https://divyatak.art">Divya Tak</a>.</p>
  </header>

  <div class="grid">

    <a class="piece" href="cloth/">
      <img src="thumbs/cloth.jpg" width="900" height="600" alt="A mint sheet of cloth hanging in the dark, folded by unseen fingertips">
      <span class="cap">Cloth</span>
    </a>

    <a class="piece" href="portal/">
      <img src="thumbs/portal.jpg" width="900" height="600" alt="A dark window held open over a pink room, with lit fireflies drifting inside it">
      <span class="cap">Portal</span>
    </a>

    <a class="piece" href="particles/">
      <img src="thumbs/particles.jpg" width="900" height="600" alt="Two glowing blue hand silhouettes in a field of cyan algae, the algae swept into wakes around them">
      <span class="cap">Bioluminescent Flow</span>
    </a>

    <a class="piece" href="webcam/">
      <img src="thumbs/webcam.jpg" width="900" height="600" loading="lazy" alt="Divya in the pixel mirror, her face and raised hand rebuilt in hot orange and deep blue">
      <span class="cap">Webcam Magic</span>
    </a>

    <a class="piece" href="emotion/">
      <img src="thumbs/emotion.jpg" width="900" height="600" loading="lazy" alt="A pink chrysanthemum in full bloom against near-black">
      <span class="cap">(e)motion</span>
    </a>

    <a class="piece" href="lenticular/">
      <img class="tall" src="thumbs/lenticular.jpg" width="414" height="638" loading="lazy" alt="A photograph of a Seoul rooftop with a drawn figure sitting on it, emerging in stripes">
      <span class="cap">(un)seen Lenticular</span>
    </a>

  </div>

  <footer>
    <span>In the workshop: Audio Reactive &middot; Particle Face Mask</span>
    <a href="https://divyatak.art">divyatak.art</a>
  </footer>

</main>
</body>
</html>
