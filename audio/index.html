<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Soundscape</title>
  <style>
    * { margin: 0; padding: 0; }
    body { background: #050508; overflow: hidden; }
    canvas { display: block; }
    #back { position: fixed; top: 20px; left: 20px; color: rgba(255,255,255,0.35);
      font: 14px monospace; text-decoration: none; z-index: 40; cursor: pointer; }
    #back:hover { color: rgba(255,255,255,0.8); }
    #ui { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
      align-items: center; justify-content: center; }
    #ui.hidden { opacity: 0; pointer-events: none; transition: opacity 1s; }
    #drop-text { font: 22px monospace; color: rgba(255,255,255,0.3); letter-spacing: 3px; cursor: pointer; }
    #drop-sub { margin-top: 8px; font: 12px monospace; color: rgba(255,255,255,0.15); }
    #file-input { display: none; }
    #controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      z-index: 20; opacity: 0; transition: opacity 0.5s; }
    #controls.visible { opacity: 1; }
    #controls button { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.4); font: 13px monospace; padding: 6px 16px; border-radius: 4px; cursor: pointer; }
    #controls button:hover { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.7); }
    #loading { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
      font: 11px monospace; color: rgba(255,255,255,0.15); z-index: 20; }
  </style>
</head>
<body>
  <a id="back" href="../">&larr; back</a>
  <div id="ui">
    <div id="drop-text">drop an audio file or click here</div>
    <div id="drop-sub">supports mp3, wav, ogg, flac</div>
  </div>
  <input type="file" id="file-input" accept="audio/*">
  <div id="controls"><button id="pause-btn">pause</button></div>
  <div id="loading"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // ══════════════════════════════════════════════
    // RENDERER
    // ══════════════════════════════════════════════
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x050508);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    // no fog — was causing dark overlay artifacts

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 25, 60);
    camera.lookAt(0, 5, 0);

    // subtle ambient light
    scene.add(new THREE.AmbientLight(0x222244, 0.5));
    // directional for form
    const dirLight = new THREE.DirectionalLight(0x4466aa, 0.8);
    dirLight.position.set(10, 30, 20);
    scene.add(dirLight);

    // ══════════════════════════════════════════════
    // AUDIO
    // ══════════════════════════════════════════════
    let audioCtx, analyser, freqData, audioReady = false, sourceConnected = false;
    const audioEl = new Audio();

    function initAudio(file) {
      if (!audioCtx) {
        audioCtx = new AudioContext();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 1024;
        analyser.smoothingTimeConstant = 0.82;
        freqData = new Uint8Array(analyser.frequencyBinCount);
      }
      audioEl.src = URL.createObjectURL(file);
      audioEl.loop = true;
      if (!sourceConnected) {
        audioCtx.createMediaElementSource(audioEl).connect(analyser);
        analyser.connect(audioCtx.destination);
        sourceConnected = true;
      }
      audioEl.play(); audioReady = true;
      document.getElementById('ui').className = 'hidden';
      document.getElementById('controls').className = 'visible';
    }

    function getEnergy(low, high) {
      if (!audioReady) return 0;
      analyser.getByteFrequencyData(freqData);
      const bins = freqData.length, ny = audioCtx.sampleRate / 2;
      const lo = Math.floor(low / ny * bins), hi = Math.min(Math.floor(high / ny * bins), bins - 1);
      let sum = 0, count = 0;
      for (let i = lo; i <= hi; i++) { sum += freqData[i]; count++; }
      return count > 0 ? (sum / count) / 255 : 0;
    }

    // file handling
    document.getElementById('ui').addEventListener('click', () => document.getElementById('file-input').click());
    document.getElementById('file-input').addEventListener('change', (e) => { if (e.target.files[0]) initAudio(e.target.files[0]); });
    document.body.addEventListener('dragover', (e) => e.preventDefault());
    document.body.addEventListener('drop', (e) => {
      e.preventDefault();
      const f = e.dataTransfer.files[0];
      if (f && f.type.startsWith('audio/')) initAudio(f);
    });

    let paused = false;
    document.getElementById('pause-btn').addEventListener('click', () => {
      paused = !paused;
      if (paused) { audioEl.pause(); document.getElementById('pause-btn').textContent = 'play'; }
      else { audioEl.play(); document.getElementById('pause-btn').textContent = 'pause'; }
    });
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && audioReady) { e.preventDefault(); document.getElementById('pause-btn').click(); }
    });

    // ══════════════════════════════════════════════
    // LOAD ROCK MODELS
    // ══════════════════════════════════════════════
    const loader = new GLTFLoader();
    const rockCache = {}; // name → geometry

    async function loadModel(name) {
      return new Promise((resolve) => {
        loader.load(`models/${name}.glb`, (gltf) => {
          gltf.scene.traverse((child) => {
            if (child.isMesh) {
              rockCache[name] = child.geometry;
              resolve(child.geometry);
            }
          });
        }, undefined, () => resolve(null));
      });
    }

    // ══════════════════════════════════════════════
    // SCENE LAYOUT — orchestra sections
    // ══════════════════════════════════════════════
    // Sections clustered like a real orchestra, audience at +Z
    // All rocks shatter, each within its own small area
    const ROCK_LAYOUT = [
      // ROW 4 (back, y=6) — PERCUSSION: boulders (bass) + WOODWINDS: pillars (highs)
      { model: 'boulder_1', pos: [-8,  6, -8],  scale: 5, band: 'bass', spread: 1.5 },
      { model: 'boulder_2', pos: [ 0,  6, -10], scale: 6, band: 'bass', spread: 1.8 },
      { model: 'boulder_3', pos: [ 8,  6, -8],  scale: 5, band: 'bass', spread: 1.5 },
      { model: 'pillar_1',  pos: [-22, 6, -5],  scale: 4, band: 'high', spread: 1 },
      { model: 'pillar_2',  pos: [-28, 6, -3],  scale: 4, band: 'high', spread: 1 },
      { model: 'pillar_3',  pos: [ 22, 6, -5],  scale: 4, band: 'high', spread: 1 },

      // ROW 3 (y=4) — DOUBLE BASS: cubes (sub) + CELLOS: slabs (low mids)
      { model: 'cube_1',  pos: [ 18, 4, -5], scale: 4, band: 'sub', spread: 1.2 },
      { model: 'cube_2',  pos: [ 24, 4, -3], scale: 4, band: 'sub', spread: 1.2 },
      { model: 'slab_1',  pos: [-18, 4, -5], scale: 5, band: 'lowmid', spread: 1.2 },
      { model: 'slab_2',  pos: [-24, 4, -3], scale: 5, band: 'lowmid', spread: 1.2 },

      // ROW 2 (y=2) — VIOLAS: orbs (mids) + VIOLINS: crystals (high mids)
      { model: 'orb_1',     pos: [-12, 2, -2], scale: 3, band: 'mid', spread: 1 },
      { model: 'orb_2',     pos: [-18, 2, 0],  scale: 3, band: 'mid', spread: 1 },
      { model: 'crystal_1', pos: [ 10, 2, -2], scale: 4, band: 'highmid', spread: 1.2 },
      { model: 'crystal_2', pos: [ 16, 2, 0],  scale: 4, band: 'highmid', spread: 1.2 },

      // ROW 1 (front, y=0) — SMALL PERCUSSION: pebbles (hi-hats)
      { model: 'pebble_1', pos: [-5, 0, 5],  scale: 3, band: 'hihat', spread: 0.8 },
      { model: 'pebble_2', pos: [ 0, 0, 7],  scale: 2.5, band: 'hihat', spread: 0.8 },
      { model: 'pebble_3', pos: [ 5, 0, 5],  scale: 3, band: 'hihat', spread: 0.8 },
    ];

    // frequency bands
    const BANDS = {
      sub:     [20, 60],
      bass:    [60, 200],
      lowmid:  [200, 600],
      mid:     [600, 2000],
      highmid: [2000, 6000],
      high:    [6000, 12000],
      hihat:   [8000, 16000],
    };

    // neon colors per band
    const BAND_COLORS = {
      sub:     new THREE.Color(0xff0040),
      bass:    new THREE.Color(0xff0066),
      lowmid:  new THREE.Color(0xaa00ff),
      mid:     new THREE.Color(0x4400ff),
      highmid: new THREE.Color(0x0066ff),
      high:    new THREE.Color(0x00ccff),
      hihat:   new THREE.Color(0x00ffcc),
    };

    const rocks = []; // { mesh, config, baseY, material }

    async function buildScene() {
      const loadEl = document.getElementById('loading');
      const needed = [...new Set(ROCK_LAYOUT.map(r => r.model))];
      let loaded = 0;
      for (const name of needed) {
        loadEl.textContent = `loading models... ${++loaded}/${needed.length}`;
        await loadModel(name);
      }
      loadEl.textContent = '';

      // stepped semicircular risers (like orchestra seating)
      const riserMat = new THREE.MeshBasicMaterial({ color: 0x0a0a18, wireframe: true, transparent: true, opacity: 0.06 });
      const STEPS = [
        { radius: 15, height: 0, y: 0 },     // front — small percussion
        { radius: 22, height: 2, y: 2 },     // second — violins/crystals
        { radius: 30, height: 4, y: 4 },     // third — violas/cellos
        { radius: 40, height: 6, y: 6 },     // back — percussion/bass/woodwinds
      ];
      for (const step of STEPS) {
        // semicircular platform: half-cylinder
        const geo = new THREE.CylinderGeometry(step.radius, step.radius, step.height || 0.5, 32, 1, false, 0, Math.PI);
        const mesh = new THREE.Mesh(geo, riserMat.clone());
        mesh.position.set(0, step.y / 2, 0);
        mesh.rotation.y = Math.PI; // open toward camera
        scene.add(mesh);
        // flat top surface
        const topGeo = new THREE.CircleGeometry(step.radius, 32, 0, Math.PI);
        topGeo.rotateX(-Math.PI / 2);
        const topMesh = new THREE.Mesh(topGeo, riserMat.clone());
        topMesh.position.set(0, step.y, 0);
        topMesh.rotation.y = Math.PI;
        scene.add(topMesh);
      }

      // all rocks shatter — decompose each into individual faces
      for (const config of ROCK_LAYOUT) {
        const geo = rockCache[config.model];
        if (!geo) continue;
        const color = BAND_COLORS[config.band] || new THREE.Color(0x00e5ff);

        const nonIdx = geo.index ? geo.toNonIndexed() : geo;
        const arr = nonIdx.attributes.position.array;
        const group = new THREE.Group();
        group.position.set(config.pos[0], config.pos[1], config.pos[2]);
        group.scale.setScalar(config.scale);
        group.rotation.y = Math.random() * Math.PI * 2;

        const faces = [];
        for (let f = 0; f < arr.length; f += 9) {
          const v = new Float32Array(arr.slice(f, f + 9));
          const cx = (v[0]+v[3]+v[6])/3, cy = (v[1]+v[4]+v[7])/3, cz = (v[2]+v[5]+v[8])/3;
          const d = Math.sqrt(cx*cx+cy*cy+cz*cz) || 1;
          for (let j = 0; j < 9; j += 3) { v[j]-=cx; v[j+1]-=cy; v[j+2]-=cz; }
          const fg = new THREE.BufferGeometry();
          fg.setAttribute('position', new THREE.BufferAttribute(v, 3));
          const fm = new THREE.Mesh(fg, new THREE.MeshBasicMaterial({
            color: color.clone(), wireframe: true, transparent: true, opacity: 0.6, side: THREE.DoubleSide
          }));
          fm.position.set(cx, cy, cz);
          group.add(fm);
          faces.push({ m: fm, cx, cy, cz, d, nx: cx/d, ny: cy/d, nz: cz/d });
        }

        scene.add(group);
        rocks.push({
          mesh: group, config, faces,
          baseY: config.pos[1], baseScale: config.scale,
          seed: Math.random() * 100,
          spread: config.spread || 3,
        });
      }
    }

    buildScene();

    // ══════════════════════════════════════════════
    // ANIMATE
    // ══════════════════════════════════════════════
    let time = 0;
    const smoothEnergy = {};
    const prevEnergy = {};
    const attacks = {};
    for (const band of Object.keys(BANDS)) {
      smoothEnergy[band] = 0;
      prevEnergy[band] = 0;
      attacks[band] = 0;
    }

    function animate() {
      requestAnimationFrame(animate);
      time += 0.016;

      // update all band energies
      for (const [band, [lo, hi]] of Object.entries(BANDS)) {
        const raw = getEnergy(lo, hi);
        smoothEnergy[band] += (raw - smoothEnergy[band]) * 0.15;
        attacks[band] = Math.max(0, raw - prevEnergy[band]);
        prevEnergy[band] = raw;
      }

      // update each rock — all shatter within their spread area
      for (const rock of rocks) {
        const e = smoothEnergy[rock.config.band] || 0;
        const atk = attacks[rock.config.band] || 0;
        const punch = Math.max(0, atk * 4);
        const spread = rock.spread;
        const baseColor = BAND_COLORS[rock.config.band];

        // shatter: subtle outward movement, faces stay close
        const explode = (punch * spread * 1.5) + (e * spread * 0.3);
        for (const f of rock.faces) {
          f.m.position.set(
            f.cx + f.nx * explode,
            f.cy + f.ny * explode,
            f.cz + f.nz * explode
          );
          f.m.material.color.copy(baseColor).multiplyScalar(0.6 + e * 1.5);
          f.m.material.opacity = 0.6 + e * 0.3;
        }

        // gentle lift
        rock.mesh.position.y = rock.baseY + e * 0.8 + punch * 0.5;
      }

      // camera: zoomed out, full view of the stage
      camera.position.x = Math.sin(time * 0.03) * 10;
      camera.position.z = 70 + Math.cos(time * 0.025) * 5;
      camera.position.y = 20 + Math.sin(time * 0.04) * 3;
      camera.lookAt(0, 3, -5);

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    });
  </script>
</body>
</html>
